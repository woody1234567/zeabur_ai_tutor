name: recommend_materials
description: Recommend class materials available to the authenticated student based on their enrolled classrooms and optional search keywords.
inputSchema:
  type: object
  properties:
    keyword:
      type: string
      maxLength: 100
      description: Optional keyword to filter materials by name, subject, or hashtags
    limit:
      type: integer
      minimum: 1
      maximum: 20
      default: 5
      description: Maximum number of recommendations to return
annotations:
  readOnlyHint: true
  destructiveHint: false
  idempotentHint: true
  openWorldHint: false
